<title>봉쇄된 제7연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ink:#0e151a; --ink-2:#121b22; --panel:#18222b; --panel-2:#1f2b35;
  --line:#2c3b47; --line-soft:#223039;
  --text:#dbe4ea; --muted:#8497a3;
  --amber:#eda440; --amber-deep:#a8701f;
  --cyan:#5ad0c0; --red:#e2635a; --violet:#a86bb5;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
  --display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink);
  background-image:
    radial-gradient(120% 70% at 50% -10%, rgba(237,164,64,.15), rgba(237,164,64,0) 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(90,208,192,.06), rgba(90,208,192,0) 70%);
  background-attachment:fixed;
  color:var(--text); font-family:var(--sans); line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 60px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  border:1px solid var(--line);border-radius:3px;
  background:linear-gradient(180deg,var(--panel),var(--ink-2));padding:11px 13px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.lamp{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.stat i{font-style:normal;font-size:9.5px;letter-spacing:.13em;color:var(--muted)}
.stat.hot b{color:var(--amber)}

/* 구역 레일 */
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.door{border:1px solid var(--line-soft);border-radius:2px;background:rgba(0,0,0,.22);padding:8px 5px;text-align:center}
.door em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.door strong{display:block;font-size:11px;font-weight:500;color:#5e6f7b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door.now{border-color:var(--amber);background:rgba(237,164,64,.08)}
.door.now em,.door.now strong{color:var(--amber)}
.door.done{border-color:rgba(90,208,192,.4);background:rgba(90,208,192,.06)}
.door.done em{color:var(--cyan)}
.door.done strong{color:#7fa79f}

/* 헤더 */
.head{margin-top:22px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--amber)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6.8vw,40px);line-height:1.12;
  margin:5px 0 0;text-wrap:balance;color:#eef4f7}
.progress{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.progress b{color:var(--cyan);font-weight:600}
.flavor{margin:12px 0 0;max-width:62ch;color:#adbdc7;font-size:14.5px;font-weight:300;
  border-left:2px solid var(--amber-deep);padding-left:13px}

/* 장면 */
.sceneBox{margin-top:16px;position:relative;border:1px solid var(--line);border-radius:3px;background:#090f14;overflow:hidden}
svg.scene{display:block;width:100%;height:auto}
.scene .wall{fill:#16202a}
.scene .wall2{fill:#101820}
.scene .floor{fill:#0c1319}
.scene .obj{fill:#1e2b36}
.scene .objd{fill:#141d25}
.scene .obj2{fill:#25333f}
.scene .metal{fill:#2b3d4b}
.scene .dark{fill:#0a1016}
.scene .ln{stroke:#33444f;stroke-width:1.3;fill:none}
.scene .lnf{stroke:#3f5460;stroke-width:1;fill:none}
.scene .amber{fill:var(--amber)}
.scene .cyan{fill:var(--cyan)}
.scene .lbl{fill:#63757f;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em}
.scene .hot{fill:rgba(255,255,255,0);cursor:pointer;stroke:rgba(237,164,64,0);stroke-width:1.5;transition:fill .15s,stroke .15s}
.scene .hot:hover{fill:rgba(237,164,64,.13);stroke:var(--amber)}
.scene .hot:focus-visible{fill:rgba(237,164,64,.13);stroke:var(--amber);outline:none}
.scene .pin{fill:var(--amber);animation:blip 2.2s ease-in-out infinite;pointer-events:none}
.scene .pin.seen{fill:#4c5d69;animation:none;opacity:.7}
.scene .pin.lock{fill:var(--cyan);animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.scanhint{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#596b77;pointer-events:none}

/* 조사 패널 */
.detail{margin-top:12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:16px}
.detail.empty{background:transparent;border-style:dashed;color:var(--muted);font-size:13.5px;text-align:center;padding:22px 16px}
.dtag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}
.dtag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber)}
.dtitle{font-size:18px;font-weight:600;margin:7px 0 0;color:#eef4f7}
.dtext{margin:9px 0 0;font-size:15px;line-height:1.75;white-space:pre-line;color:#c3d1da;text-wrap:pretty}
.dart{margin-top:14px;border:1px solid var(--line-soft);border-radius:2px;background:#0b1217;padding:12px}
.dart svg{display:block;width:100%;height:auto}
.noted{margin-top:13px;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#9ec3bb}
.noted b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);flex:none;padding-top:2px}
.nothing{margin-top:13px;font-size:12.5px;color:#6d7e8a;font-style:italic}

/* 자물쇠 */
.lockbox{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:15px}
.lockhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lockhead h3{margin:0;font-size:15px;font-weight:600;color:var(--amber)}
.lockhead span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em}
.answer{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
input[type=text]{flex:1 1 170px;min-width:0;font:inherit;font-family:var(--mono);font-size:17px;letter-spacing:.3em;
  color:var(--text);background:#090f14;border:1px solid var(--line);border-radius:2px;padding:11px 13px;text-align:center}
input[type=text]::placeholder{color:#44545f;letter-spacing:.15em;font-size:13px}
input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}

.seq{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
.cbtn{width:54px;height:54px;border-radius:2px;border:1px solid var(--line);cursor:pointer;
  background:#0b1217;display:grid;place-items:center;transition:transform .08s,box-shadow .15s}
.cbtn span{width:26px;height:26px;border-radius:50%;display:block}
.cbtn:hover{transform:translateY(-2px)}
.cbtn.pressed{box-shadow:inset 0 0 0 2px var(--cyan)}
.seqview{margin-top:11px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.14em;min-height:1.3em}

.switchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px;max-width:360px}
.sw{border:1px solid var(--line);border-radius:2px;background:#0b1217;padding:9px 4px 8px;cursor:pointer;text-align:center;transition:border-color .15s}
.sw em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.sw .track{width:20px;height:34px;margin:6px auto 0;border:1px solid var(--line);border-radius:2px;background:#060b0f;position:relative}
.sw .knob{position:absolute;left:2px;right:2px;height:14px;bottom:2px;background:#3a4c58;border-radius:1px;transition:bottom .16s}
.sw.on{border-color:var(--cyan)}
.sw.on .knob{bottom:16px;background:var(--cyan)}
.sw.on em{color:var(--cyan)}
.sw:hover{border-color:var(--amber)}

.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:2px;
  padding:11px 20px;border:1px solid var(--amber);background:var(--amber);color:#1a1205;transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--amber);border-color:var(--amber);filter:none}
.btn.big{padding:13px 24px;font-size:15px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.meta{display:flex;gap:14px;align-items:center;margin-top:13px;flex-wrap:wrap}
.hintbtn{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:none;padding:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.hintbtn:hover:not(:disabled){color:var(--amber)}
.hintbtn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13.5px;font-weight:500;min-height:1.2em}
.msg.bad{color:var(--red)} .msg.good{color:var(--cyan)}
.hint{margin-top:12px;padding:10px 13px;border-left:2px solid var(--amber);background:rgba(237,164,64,.07);font-size:13.5px;color:#d3bd97}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* 해제 */
.unlock{margin-top:14px;border:1px solid rgba(90,208,192,.42);border-radius:3px;
  background:linear-gradient(180deg,rgba(90,208,192,.1),rgba(90,208,192,.02));padding:18px 16px}
.unlock .eyebrow{color:var(--cyan)}
.unlock p{margin:9px 0 0;font-size:14.5px;color:#a9c3bd;max-width:60ch}
.gotitem{display:inline-flex;align-items:center;gap:9px;margin-top:13px;border:1px solid rgba(90,208,192,.45);
  border-radius:2px;background:rgba(0,0,0,.3);padding:8px 13px;font-size:13.5px;color:var(--cyan)}
.gotitem em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#6f8f89}

/* 수첩 / 소지품 */
.trays{margin-top:20px;display:grid;gap:10px}
.tray{border:1px solid var(--line);border-radius:3px;background:var(--ink-2);overflow:hidden}
.tray>button{width:100%;font:inherit;text-align:left;background:none;border:none;color:var(--text);
  padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tray>button:hover{background:rgba(237,164,64,.05)}
.tray>button .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted)}
.tray>button .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--amber)}
.tray>button .caret{color:var(--muted);font-size:11px}
.traybody{padding:0 14px 14px;display:none}
.tray.open .traybody{display:block}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.notes li{display:flex;gap:11px;font-size:13.5px;color:#c3d1da;border-left:2px solid var(--line);padding-left:11px;line-height:1.6}
.notes li em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);flex:none;padding-top:3px;width:46px}
.notes .none{color:#6d7e8a;border:none;padding:0;font-size:13px}
.items{display:flex;gap:9px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:2px;background:#0b1217;padding:9px 13px;font-size:13.5px;color:var(--cyan);display:flex;align-items:center;gap:8px}
.item svg{width:18px;height:18px;flex:none}

/* 엔딩 */
.ending{border:1px solid var(--cyan);border-radius:3px;background:linear-gradient(180deg,rgba(90,208,192,.1),rgba(0,0,0,.25));padding:26px 20px;margin-top:20px}
.ending h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6.4vw,38px);margin:8px 0 0;color:#eef4f7;line-height:1.15}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:20px}
.scores div{background:var(--ink-2);padding:12px 11px}
.scores b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--cyan);font-variant-numeric:tabular-nums}
.scores i{font-style:normal;font-size:10px;letter-spacing:.13em;color:var(--muted)}
.rank{margin-top:17px;font-size:15px;color:#c7d5dd}
.rank b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--amber)}
footer{margin-top:30px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#4f5f6a;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ============ 상태 ============ */
var S={room:0,seen:{},solved:{},items:[],notes:[],wrongs:0,hints:3,hintShown:false,
       open:null,start:Date.now(),done:false,seq:[],sw:{},trays:{}};
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(ms){var t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function tick(){if(!S.done)$("#clock").textContent=fmt(Date.now()-S.start)}
setInterval(tick,500);
function key(r,id){return r+":"+id}
function addNote(zone,txt){
  for(var i=0;i<S.notes.length;i++) if(S.notes[i].t===txt) return;
  S.notes.push({z:zone,t:txt});
}
function hasItem(n){return S.items.indexOf(n)>=0}

/* ============ 렌더 ============ */
function renderRail(){
  $("#wrongs").textContent=S.wrongs; $("#hintsLeft").textContent=S.hints;
  $("#rail").innerHTML=ROOMS.map(function(r,i){
    var cls=i<S.room?"done":((i===S.room&&!S.done)?"now":"");
    return '<div class="door '+cls+'"><em>'+(i<S.room?"OPEN":("0"+(i+1)))+'</em><strong>'+r.name+'</strong></div>';
  }).join("");
}

function render(){
  var R=ROOMS[S.room];
  var total=R.spots.length, found=R.spots.filter(function(s){return S.seen[key(S.room,s.id)]}).length;

  var h='<div class="head"><div><div class="eyebrow">'+R.zone+'</div><h1>'+R.name+'</h1></div>'
      + '<div class="progress">조사 <b>'+found+'</b>/'+total+'</div></div>'
      + '<p class="flavor">'+esc(R.flavor).replace(/\n/g,"<br>")+'</p>';

  /* 장면 */
  var hots=R.spots.map(function(s){
    var seen=S.seen[key(S.room,s.id)];
    var solv=s.lock&&S.solved[S.room];
    var pc="pin"+(s.lock?(solv?" seen":" lock"):(seen?" seen":""));
    return '<g><rect class="hot" tabindex="0" role="button" aria-label="'+s.title+'" data-spot="'+s.id+'" x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" rx="2"></rect>'
         + '<circle class="'+pc+'" cx="'+s.px+'" cy="'+s.py+'" r="4.2"></circle></g>';
  }).join("");
  h+='<div class="sceneBox"><svg class="scene" viewBox="0 0 600 340" role="img" aria-label="'+R.name+' 내부">'
   + R.art + '<g>'+hots+'</g></svg><div class="scanhint">밝은 점을 눌러 조사</div></div>';

  /* 조사 패널 */
  h+=renderDetail();

  /* 해제 후 이동 */
  if(S.solved[S.room] && !R.final){
    var nx=ROOMS[S.room+1];
    h+='<div class="unlock"><div class="eyebrow">구역 개방</div>'
     + '<p>'+esc(R.lock.solved).replace(/\n/g,"<br>")+'</p>'
     + (R.lock.item?'<div class="gotitem"><em>획득</em>'+R.lock.item.name+'</div>':'')
     + '<div style="margin-top:16px"><button class="btn big" id="next">'+nx.zone+' · '+nx.name+' 진입</button></div></div>';
  }

  /* 수첩 / 소지품 */
  h+='<div class="trays">'
   + tray("notes","단서 수첩","NOTEBOOK",S.notes.length,
       S.notes.length?'<ul class="notes">'+S.notes.map(function(n){
         return '<li><em>'+n.z.replace("구역","구")+'</em><span>'+esc(n.t)+'</span></li>'}).join("")+'</ul>'
        :'<p class="notes none">아직 기록한 단서가 없다. 방 안을 조사하면 여기에 모인다.</p>')
   + tray("items","소지품","INVENTORY",S.items.length,
       S.items.length?'<div class="items">'+S.items.map(function(i){
         return '<div class="item"><svg viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="12" rx="2" fill="none" stroke="#5ad0c0" stroke-width="1.6"/><path d="M5 9h6" stroke="#5ad0c0" stroke-width="1.6"/></svg>'+i+'</div>'}).join("")+'</div>'
        :'<p class="notes none">가진 것이 없다.</p>')
   + '<div class="tray"><button id="resetBtn"><span class="k">처음부터 다시</span><span class="caret">↺</span></button></div>'
   + '</div>';

  $("#stage").innerHTML=h;
  wire(); renderRail();
}

function tray(id,label,tag,n,body){
  return '<div class="tray'+(S.trays[id]?" open":"")+'" data-tray="'+id+'">'
   + '<button><span class="k">'+tag+'</span><span>'+label+'</span><span class="n">'+n+'</span><span class="caret">'+(S.trays[id]?"▲":"▼")+'</span></button>'
   + '<div class="traybody">'+body+'</div></div>';
}

function renderDetail(){
  var R=ROOMS[S.room];
  if(!S.open) return '<div class="detail empty">조사할 지점을 고르세요. 단서 하나로는 자물쇠가 열리지 않습니다.</div>';
  var sp=null; R.spots.forEach(function(s){if(s.id===S.open)sp=s});
  if(!sp) return '';

  var usedText=sp.text, usedNote=sp.note;
  if(sp.text2 && S.solved[S.room]){ usedText=sp.text2; usedNote=sp.note2; }

  var h='<div class="detail" id="detail"><div class="dtag">조사 중</div><div class="dtitle">'+sp.title+'</div>'
      + '<p class="dtext">'+esc(usedText).replace(/\n/g,"<br>")+'</p>';
  if(sp.art) h+='<div class="dart">'+sp.art+'</div>';
  if(usedNote) h+='<div class="noted"><b>수첩 기록</b><span>'+esc(usedNote)+'</span></div>';
  else if(!sp.lock) h+='<div class="nothing">기록할 만한 것은 없었다.</div>';

  if(sp.lock) h+=renderLock();
  h+='</div>';
  return h;
}

function renderLock(){
  var R=ROOMS[S.room], L=R.lock;
  if(S.solved[S.room]) return '<div class="lockbox"><div class="lockhead"><h3>해제됨</h3><span>'+L.name+'</span></div></div>';

  var h='<div class="lockbox"><div class="lockhead"><h3>'+L.name+'</h3><span>'+(L.sub||"")+'</span></div>';

  if(L.type==="keypad"){
    h+='<div class="answer"><input type="text" id="ans" inputmode="numeric" maxlength="4" placeholder="'+(L.ph||"입력")+'" autocomplete="off">'
     + '<button class="btn" id="submit">입력</button></div>';
  } else if(L.type==="sequence"){
    h+='<div class="seq">'+L.colors.map(function(c){
        return '<button class="cbtn" data-c="'+c.k+'" title="'+c.label+'"><span style="background:'+c.hex+'"></span></button>'}).join("")+'</div>'
     + '<div class="seqview" id="seqview">입력: '+(S.seq.length?S.seq.map(function(k){
        var f=""; L.colors.forEach(function(c){if(c.k===k)f=c.label}); return f}).join(" › ") : "—")+'</div>'
     + '<div class="answer" style="margin-top:6px"><button class="btn ghost" id="seqclear">처음부터</button></div>';
  } else if(L.type==="switches"){
    var labels=["A1","A2","A3","A4","B1","B2","B3","B4"];
    h+='<div class="switchgrid">'+labels.map(function(l){
        return '<div class="sw'+(S.sw[l]?" on":"")+'" data-sw="'+l+'" role="button" tabindex="0"><em>'+l+'</em><div class="track"><div class="knob"></div></div></div>'}).join("")+'</div>'
     + '<div class="answer" style="margin-top:12px"><button class="btn" id="submit">차단기 투입</button></div>';
  }

  h+='<div class="meta"><button class="hintbtn" id="hintBtn"'+((S.hints<=0&&!S.hintShown)?" disabled":"")+'>'
   + (S.hintShown?"힌트 사용됨":"힌트 보기 (남은 "+S.hints+"회)")+'</button><span class="msg" id="msg"></span></div>';
  if(S.hintShown) h+='<div class="hint">'+esc(L.hint)+'</div>';
  h+='</div>';
  return h;
}

/* ============ 동작 ============ */
function wire(){
  var R=ROOMS[S.room];

  Array.prototype.forEach.call(document.querySelectorAll("[data-spot]"),function(el){
    el.onclick=function(){ openSpot(el.dataset.spot) };
    el.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();openSpot(el.dataset.spot)} };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-tray] > button"),function(b){
    var id=b.parentNode.dataset.tray;
    if(id) b.onclick=function(){ S.trays[id]=!S.trays[id]; render() };
  });
  var rb=$("#resetBtn");
  if(rb) rb.onclick=function(){ if(window.confirm("진행 상황을 지우고 처음부터 시작할까요?")) reset() };

  var nx=$("#next");
  if(nx) nx.onclick=function(){
    var to=ROOMS[S.room+1];
    if(to.needs && !hasItem(to.needs.item)){ window.alert(to.needs.fail); return }
    S.room++; S.open=null; S.hintShown=false; S.seq=[]; S.sw={};
    render(); window.scrollTo({top:0,behavior:"smooth"});
  };

  var hb=$("#hintBtn");
  if(hb) hb.onclick=function(){ if(S.hintShown||S.hints<=0)return; S.hints--; S.hintShown=true; render(); keepOpen() };

  var L=R.lock;
  var sb=$("#submit");
  if(L && !S.solved[S.room]){
    if(L.type==="keypad"){
      var inp=$("#ans");
      var go=function(){ tryLock(inp.value.trim()===L.answer) };
      if(sb) sb.onclick=go;
      if(inp){ inp.onkeydown=function(e){ if(e.key==="Enter") go() }; }
    } else if(L.type==="sequence"){
      Array.prototype.forEach.call(document.querySelectorAll("[data-c]"),function(b){
        b.onclick=function(){
          S.seq.push(b.dataset.c);
          if(S.seq.length>=4){
            var ok=S.seq.join("")===L.answer.join("");
            if(!ok) S.seq=[];
            tryLock(ok);
          } else { render(); keepOpen() }
        };
      });
      var sc=$("#seqclear"); if(sc) sc.onclick=function(){ S.seq=[]; render(); keepOpen() };
    } else if(L.type==="switches"){
      Array.prototype.forEach.call(document.querySelectorAll("[data-sw]"),function(el){
        var t=function(){ S.sw[el.dataset.sw]=!S.sw[el.dataset.sw]; render(); keepOpen() };
        el.onclick=t;
        el.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();t()} };
      });
      if(sb) sb.onclick=function(){
        var aOn=["A1","A2","A3","A4"].some(function(k){return S.sw[k]});
        var bAll=["B1","B2","B3","B4"].every(function(k){return S.sw[k]});
        if(aOn){ tryLock(false,"A 라인이 올라갔다. 어딘가에서 경보가 짧게 울린다."); return }
        tryLock(bAll, bAll?"":"전원이 부족하다. B 라인이 다 올라가지 않았다.");
      };
    }
  }
}

function keepOpen(){
  var d=$("#detail");
  if(d) d.scrollIntoView({block:"nearest"});
  var i=$("#ans"); if(i) i.focus({preventScroll:true});
}

function openSpot(id){
  S.open=id; S.seen[key(S.room,id)]=true;
  var R=ROOMS[S.room], sp=null;
  R.spots.forEach(function(s){if(s.id===id)sp=s});
  if(sp){
    var n = (sp.text2&&S.solved[S.room]) ? sp.note2 : sp.note;
    if(n) addNote(R.zone,n);
  }
  render();
  var d=$("#detail"); if(d) d.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function tryLock(ok,failMsg){
  var R=ROOMS[S.room], L=R.lock;
  if(ok){
    S.solved[S.room]=true; S.hintShown=false;
    if(L.item && !hasItem(L.item.name)) S.items.push(L.item.name);
    if(L.note) addNote(R.zone,L.note);
    if(L.reexamine) S.open=L.reexamine;
    if(R.final){ finish(); return }
    render();
    var u=document.querySelector(".unlock"); if(u) u.scrollIntoView({behavior:"smooth",block:"center"});
  } else {
    S.wrongs++;
    render(); keepOpen();
    var m=$("#msg");
    if(m){ m.className="msg bad";
      m.textContent = failMsg || ["잠금이 반응하지 않는다.","틀렸다. 수첩을 다시 보라.","기계음만 짧게 울린다."][S.wrongs%3];
    }
    var d=$("#detail"); if(d){ d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake") }
  }
}

function finish(){
  S.done=true;
  var ms=Date.now()-S.start, t=fmt(ms), used=3-S.hints;
  var searched=0,totalSpots=0;
  ROOMS.forEach(function(R,i){ totalSpots+=R.spots.length;
    R.spots.forEach(function(s){ if(S.seen[key(i,s.id)]) searched++ }) });
  var rank="A · 침착한 탈출자", note="필요한 것만 보고 나왔다.";
  if(S.wrongs===0&&used===0){ rank="S · 무결점 탈출"; note="오조작도 힌트도 없다. 이 건물이 남긴 기록을 설계된 그대로 읽어냈다."; }
  else if(S.wrongs+used*2>=10){ rank="C · 가까스로 탈출"; note="문은 열렸다. 지금은 그게 전부다."; }
  else if(S.wrongs+used*2>=5){ rank="B · 끈질긴 탈출자"; note="막힐 때마다 결국 방으로 돌아가 다시 뒤졌다."; }

  var best="";
  try{ var p=localStorage.getItem("lab7-best");
    if(!p||ms<Number(p)){ localStorage.setItem("lab7-best",String(ms)); best="개인 최고 기록 경신"; }
    else best="개인 최고 기록 "+fmt(Number(p));
  }catch(e){}

  $("#stage").innerHTML=
   '<div class="ending"><div class="eyebrow" style="color:var(--cyan)">BLAST GATE 07 — UNSEALED</div>'
   +'<h2>게이트가 올라간다.</h2>'
   +'<p class="flavor" style="border-color:var(--cyan);color:#b8cfc9">강철이 레일을 따라 밀려 올라가고, 6년 만의 바깥 공기가 통로로 밀려든다. 뒤에서 비상등이 구역 순서대로 하나씩 꺼진다. 냉동고 3호의 팬 소리가 마지막으로 멈춘다.<br><br>제7연구소는 다시 어둠으로 돌아간다. 이번에는 안에 아무도 없다.</p>'
   +'<div class="scores">'
   +'<div><b>'+t+'</b><i>탈출 시간</i></div>'
   +'<div><b>'+searched+'/'+totalSpots+'</b><i>조사 지점</i></div>'
   +'<div><b>'+S.wrongs+'</b><i>오조작</i></div>'
   +'<div><b>'+used+'</b><i>사용 힌트</i></div>'
   +'</div>'
   +'<p class="rank"><b>'+rank+'</b><br>'+note+(best?' · '+best:'')+'</p>'
   +'<div style="margin-top:20px"><button class="btn big" id="again">다시 도전</button></div></div>';
  $("#again").onclick=reset;
  renderRail();
}

function reset(){
  S.room=0;S.seen={};S.solved={};S.items=[];S.notes=[];S.wrongs=0;S.hints=3;
  S.hintShown=false;S.open=null;S.start=Date.now();S.done=false;S.seq=[];S.sw={};S.trays={};
  render(); tick(); window.scrollTo({top:0,behavior:"smooth"});
}

/* 서버실 LED / 포트 장식 */
function decorate(){
  var la=document.getElementById("ledsA"), lb=document.getElementById("ledsB"), po=document.getElementById("ports");
  var on=S.solved[2];
  if(la&&lb){
    var g="";
    for(var r=0;r<11;r++) for(var c=0;c<5;c++){
      var lit=on&&((r*5+c)%3!==0);
      g+='<circle cx="'+(58+c*16)+'" cy="'+(90+r*14)+'" r="2.1" fill="'+(lit?"#5ad0c0":"#22303a")+'" opacity="'+(lit?0.9:1)+'"/>';
    }
    la.innerHTML=g;
    var g2="";
    for(var r2=0;r2<11;r2++) for(var c2=0;c2<5;c2++){
      var lit2=on&&((r2*3+c2)%4!==0);
      g2+='<circle cx="'+(164+c2*16)+'" cy="'+(90+r2*14)+'" r="2.1" fill="'+(lit2?"#5ad0c0":"#22303a")+'"/>';
    }
    lb.innerHTML=g2;
  }
  if(po){
    var g3="";
    for(var i=0;i<24;i++){
      var x=274+(i%12)*8.4, y=90+Math.floor(i/12)*18;
      g3+='<rect x="'+x+'" y="'+y+'" width="6" height="11" rx="1" fill="'+(i===2?"#3a5a52":"#1a252d")+'" stroke="#2f3f4a" stroke-width=".6"/>';
      if(i===2) g3+='<path d="M'+(x+3)+' '+(y+11)+' c 0 14, 26 8, 30 20" stroke="#4a7a72" stroke-width="1.6" fill="none"/>';
    }
    po.innerHTML=g3;
  }
  var so=document.getElementById("screenOn"), rl=document.getElementById("readerLed");
  if(so) so.style.display=on?"":"none";
  if(rl) rl.setAttribute("opacity",on?"1":"0.35");
  var brk=document.getElementById("brk");
  if(brk){
    var g4="";
    for(var j=0;j<8;j++){
      var bx=414+(j%4)*20, by=162+Math.floor(j/4)*40;
      var lab=(j<4?"A":"B")+((j%4)+1);
      var upv=!!S.sw[lab];
      g4+='<rect x="'+bx+'" y="'+by+'" width="12" height="26" rx="1" fill="#0c151b" stroke="#2f3f4a"/>'
        + '<rect x="'+(bx+2)+'" y="'+(upv?by+3:by+15)+'" width="8" height="8" fill="'+(upv?"#5ad0c0":"#3a4c58")+'"/>';
    }
    brk.innerHTML=g4;
  }
}
var _render=render;
render=function(){ _render(); decorate(); };

function start(saved){
  if(saved&&saved.S){ Object.assign(S,saved.S); S.start=Date.now()-(saved.elapsed||0) }
  if(S.done) finish(); else render();
  tick();
}
try{ if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)
  window.claude.hot.snapshot(function(){return {S:S,elapsed:Date.now()-S.start}}) }catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||null);
</script>
