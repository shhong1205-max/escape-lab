<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>봉쇄된 제7연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ink:#0e151a; --ink-2:#121b22; --panel:#18222b; --panel-2:#1f2b35;
  --line:#2c3b47; --line-soft:#223039;
  --text:#dbe4ea; --muted:#8497a3;
  --amber:#eda440; --amber-deep:#a8701f;
  --cyan:#5ad0c0; --red:#e2635a; --violet:#a86bb5; --lime:#9ec45f;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
  --display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);
  background-image:radial-gradient(120% 70% at 50% -10%,rgba(237,164,64,.14),rgba(237,164,64,0) 60%),
    radial-gradient(90% 60% at 50% 110%,rgba(90,208,192,.06),rgba(90,208,192,0) 70%);
  background-attachment:fixed;color:var(--text);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:9px 16px;border:1px solid var(--line);border-radius:3px;
  background:linear-gradient(180deg,var(--panel),var(--ink-2));padding:11px 13px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.lamp{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.stat i{font-style:normal;font-size:9.5px;letter-spacing:.13em;color:var(--muted)}
.stat.hot b{color:var(--amber)}
.stat.ok b{color:var(--cyan)}

/* 구역 이동 바 */
.navbar{margin-top:10px;border:1px solid var(--line-soft);border-radius:3px;background:rgba(0,0,0,.2);padding:9px}
.navlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:7px;display:block}
.zones{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
@media(min-width:330px){.zones{grid-template-columns:repeat(4,1fr)}}
@media(min-width:680px){.zones{grid-template-columns:repeat(8,1fr)}}
.zn{border:1px solid var(--line-soft);border-radius:2px;background:rgba(0,0,0,.25);padding:8px 5px 7px;text-align:center;
  cursor:pointer;transition:border-color .15s,background .15s;font:inherit;color:inherit;display:block;width:100%;min-height:44px}
.zn em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted)}
.zn strong{display:block;font-size:10.5px;font-weight:500;color:#5e6f7b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zn.open:hover{border-color:var(--amber)}
.zn.open em{color:#93a6b1} .zn.open strong{color:#93a6b1}
.zn.cur{border-color:var(--amber);background:rgba(237,164,64,.1)}
.zn.cur em,.zn.cur strong{color:var(--amber)}
.zn.clear{border-color:rgba(90,208,192,.4);background:rgba(90,208,192,.06)}
.zn.clear em{color:var(--cyan)} .zn.clear strong{color:#7fa79f}
.zn.shut{cursor:not-allowed;opacity:.5}
.zn .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-left:3px;vertical-align:1px}

.head{margin-top:20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--amber)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(27px,6.4vw,38px);line-height:1.12;margin:5px 0 0;text-wrap:balance;color:#eef4f7}
.progress{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;text-align:right}
.progress b{color:var(--cyan);font-weight:600}
.flavor{margin:12px 0 0;max-width:62ch;color:#adbdc7;font-size:14.5px;font-weight:300;border-left:2px solid var(--amber-deep);padding-left:13px}

.sceneBox{margin-top:15px;position:relative;border:1px solid var(--line);border-radius:3px;background:#090f14;overflow:hidden}
svg.scene{display:block;width:100%;height:auto}
.scene .wall{fill:#16202a} .scene .wall2{fill:#101820} .scene .floor{fill:#0c1319}
.scene .obj{fill:#1e2b36} .scene .objd{fill:#141d25} .scene .obj2{fill:#25333f}
.scene .metal{fill:#2b3d4b} .scene .dark{fill:#0a1016}
.scene .ln{stroke:#33444f;stroke-width:1.3;fill:none}
.scene .lnf{stroke:#3f5460;stroke-width:1;fill:none}
.scene .amber{fill:var(--amber)} .scene .cyan{fill:var(--cyan)}
.scene .lbl{fill:#63757f;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em}
/* 아직 찾지 못한 지점은 커서도, 호버 반응도 그대로다 — 화살표 커서가
   손가락 모양으로 바뀌는 것조차 "여기 뭔가 있다"는 신호가 되기 때문에,
   기본 커서를 유지해 클릭 가능 영역을 눈으로 구분할 수 없게 한다.
   .known(한 번 찾은 지점)만 커서·호버 강조가 함께 켜진다. */
.scene .hot{fill:rgba(255,255,255,0);stroke:rgba(237,164,64,0);stroke-width:1.5;transition:fill .15s,stroke .15s;outline:none}
.scene .hot.known{cursor:pointer}
.scene .hot.known:hover{fill:rgba(237,164,64,.13);stroke:var(--amber)}
.scene .hot.known:focus-visible{fill:rgba(237,164,64,.13);stroke:var(--amber);outline:none}
.scene .pin{fill:var(--amber);animation:blip 2.2s ease-in-out infinite;pointer-events:none}
.scene .pin.seen{fill:#4c5d69;animation:none;opacity:.7}
.scene .pin.lock{fill:var(--cyan);animation:blip 1.6s ease-in-out infinite}
.scene .pin.hid{fill:var(--violet)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.scanhint{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#596b77;pointer-events:none}

/* 조사 지점 목록 — 좁은 화면에서 정확히 누르기 위한 대체 경로 */
.spotlist{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spotlist .listlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-right:2px}
.spotlist .listlab.dim{color:#5a6a75;font-family:var(--sans);font-size:12.5px;letter-spacing:0;font-style:italic}
.spotlist button{font:inherit;font-size:13px;color:#a9bac4;background:var(--panel);border:1px solid var(--line);
  border-radius:2px;padding:11px 13px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:border-color .15s,color .15s}
.spotlist button:hover{border-color:var(--amber);color:var(--amber)}
.spotlist button .mk{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.spotlist button.seen{color:#6d7e8a}
.spotlist button.seen .mk{background:#43535e}
.spotlist button.lock .mk{background:var(--cyan)}
.spotlist button.hid{border-color:rgba(168,107,181,.5);color:#cfb0d8}
.spotlist button.hid .mk{background:var(--violet)}
.spotlist button.cur{border-color:var(--amber);color:var(--amber);background:rgba(237,164,64,.08)}
.spotlist button.done .mk{background:#43535e}

.detail{margin-top:12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:16px}
.detail.empty{background:transparent;border-style:dashed;color:var(--muted);font-size:13.5px;text-align:center;padding:20px 16px}
.dtag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}
.dtag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber)}
.dtitle{font-size:18px;font-weight:600;margin:7px 0 0;color:#eef4f7}
.dtext{margin:9px 0 0;font-size:15px;line-height:1.75;white-space:pre-line;color:#c3d1da;text-wrap:pretty}
.dart{margin-top:14px;border:1px solid var(--line-soft);border-radius:2px;background:#0b1217;padding:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dart svg{display:block;width:100%;height:auto;min-width:400px}
.dart::-webkit-scrollbar{height:6px}
.dart::-webkit-scrollbar-thumb{background:#2c3b47;border-radius:3px}
.noted{margin-top:13px;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#9ec3bb}
.noted b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);flex:none;padding-top:2px}
.nothing{margin-top:13px;font-size:12.5px;color:#6d7e8a;font-style:italic}
.reveal{margin-top:13px;padding:9px 12px;border-left:2px solid var(--violet);background:rgba(168,107,181,.09);font-size:13px;color:#cfb0d8}

.lockbox{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:15px}
.cluebox{margin:12px 0 4px;border:1px solid var(--line-soft);border-radius:2px;background:rgba(0,0,0,.18);padding:11px 13px}
.cluehead{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.cluehead b{color:var(--cyan);font-weight:600}
.cluelist{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.cluelist li{font-size:12.5px;padding:5px 10px;border-radius:2px;border:1px solid var(--line);background:rgba(0,0,0,.15)}
.cluelist li.got{color:#a9c3bd;border-color:rgba(90,208,192,.35)}
.cluelist li.got em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--cyan);margin-right:6px}
.cluelist li.todo{color:#8d7550;border-color:var(--line);border-style:dashed}
.cluelist li.todo em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--amber);margin-right:6px}
.cluelist li.blocked{color:#5a6a75;border-color:var(--line);border-style:dashed;opacity:.8}
.cluelist li.blocked em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--red);margin-right:6px}
.lockhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lockhead h3{margin:0;font-size:15px;font-weight:600;color:var(--amber)}
.lockhead span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em}
.answer{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
input[type=text]{flex:1 1 170px;min-width:0;font:inherit;font-family:var(--mono);font-size:17px;letter-spacing:.3em;
  color:var(--text);background:#090f14;border:1px solid var(--line);border-radius:2px;padding:11px 13px;text-align:center}
input[type=text]::placeholder{color:#44545f;letter-spacing:.12em;font-size:12.5px}
input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
.seq{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
.cbtn{width:52px;height:52px;border-radius:2px;border:1px solid var(--line);cursor:pointer;background:#0b1217;display:grid;place-items:center;transition:transform .08s}
.cbtn span{width:25px;height:25px;border-radius:50%;display:block}
.cbtn .ctext{width:auto;height:auto;border-radius:0;font-family:var(--mono);font-size:19px;font-weight:600;color:#c3d1da;line-height:1}
.cbtn:hover .ctext{color:var(--amber)}
.cbtn:hover{transform:translateY(-2px)}
.seqview{margin-top:11px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em;min-height:1.3em}
.switchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px;max-width:350px}
.sw{border:1px solid var(--line);border-radius:2px;background:#0b1217;padding:8px 4px 7px;cursor:pointer;text-align:center;transition:border-color .15s}
.sw em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.sw .track{width:19px;height:32px;margin:6px auto 0;border:1px solid var(--line);border-radius:2px;background:#060b0f;position:relative}
.sw .knob{position:absolute;left:2px;right:2px;height:13px;bottom:2px;background:#3a4c58;border-radius:1px;transition:bottom .16s}
.sw.on{border-color:var(--cyan)} .sw.on .knob{bottom:15px;background:var(--cyan)} .sw.on em{color:var(--cyan)}
.sw:hover{border-color:var(--amber)}

.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:2px;padding:11px 20px;
  border:1px solid var(--amber);background:var(--amber);color:#1a1205;transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--amber);border-color:var(--amber);filter:none}
.btn.big{padding:13px 24px;font-size:15px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.meta{display:flex;gap:13px;align-items:center;margin-top:13px;flex-wrap:wrap}
.hintbtn{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:none;padding:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.hintbtn:hover:not(:disabled){color:var(--amber)}
.hintbtn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13.5px;font-weight:500;min-height:1.2em}
.msg.bad{color:var(--red)}
.hints{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.hintrow{padding:9px 12px;border-left:2px solid var(--amber);background:rgba(237,164,64,.07);font-size:13.5px;color:#d3bd97}
.hintrow b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--amber);display:block;margin-bottom:3px}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.unlock{margin-top:14px;border:1px solid rgba(90,208,192,.42);border-radius:3px;
  background:linear-gradient(180deg,rgba(90,208,192,.1),rgba(90,208,192,.02));padding:17px 15px}
.unlock .eyebrow{color:var(--cyan)}
.unlock p{margin:8px 0 0;font-size:14.5px;color:#a9c3bd;max-width:60ch;white-space:pre-line}
.gotrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gotitem{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(90,208,192,.45);border-radius:2px;
  background:rgba(0,0,0,.3);padding:7px 12px;font-size:13px;color:var(--cyan)}
.gotitem em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#6f8f89}
.gotitem.open{border-color:rgba(237,164,64,.5);color:var(--amber)}
.gotitem.open em{color:#96794a}

.trays{margin-top:18px;display:grid;gap:9px}
.tray{border:1px solid var(--line);border-radius:3px;background:var(--ink-2);overflow:hidden}
.tray>button{width:100%;font:inherit;text-align:left;background:none;border:none;color:var(--text);padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tray>button:hover{background:rgba(237,164,64,.05)}
.tray>button .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}
.tray>button .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--amber)}
.tray>button .caret{color:var(--muted);font-size:11px}
.traybody{padding:0 13px 13px;display:none}
.tray.open .traybody{display:block}
.nzhead{border:1px solid var(--line-soft);border-bottom:none;border-radius:2px 2px 0 0;background:rgba(237,164,64,.06);
  padding:9px 11px;display:flex;align-items:center;gap:9px}
.nzhead .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--amber)}
.nzhead span:not(.k):not(.nzn){color:var(--amber);font-weight:500}
.nzhead .nzn{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--amber)}
.nzhead+.notes{border:1px solid var(--line-soft);border-top:none;border-radius:0 0 2px 2px;padding:10px 12px 12px;margin:0}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notes li{font-size:13.5px;color:#c3d1da;border-left:2px solid var(--line);padding-left:10px;line-height:1.6}
.notes .none{color:#6d7e8a;border:none;padding:0;font-size:13px}
.items{display:flex;gap:8px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:2px;background:#0b1217;padding:8px 12px;font-size:13px;color:var(--cyan)}

.ending{border:1px solid var(--cyan);border-radius:3px;background:linear-gradient(180deg,rgba(90,208,192,.1),rgba(0,0,0,.25));padding:26px 20px;margin-top:18px}
.ending h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6.4vw,38px);margin:8px 0 0;color:#eef4f7;line-height:1.15}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:20px}
.scores div{background:var(--ink-2);padding:12px 11px}
.scores b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--cyan);font-variant-numeric:tabular-nums}
.scores i{font-style:normal;font-size:10px;letter-spacing:.13em;color:var(--muted)}
.rank{margin-top:17px;font-size:15px;color:#c7d5dd}
.rank b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--amber)}
footer{margin-top:28px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#4f5f6a;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="wrap">
  <div class="hud">
    <div class="brand"><span class="lamp" aria-hidden="true"></span><span>SECTOR 7 · 봉쇄 D+2191</span></div>
    <div class="stat hot"><b id="clock">00:00</b><i>경과</i></div>
    <div class="stat ok"><b id="lockCount">0/14</b><i>잠금해제</i></div>
    <div class="stat"><b id="wrongs">0</b><i>오조작</i></div>
    <div class="stat"><b id="hintsLeft">6</b><i>힌트</i></div>
  </div>
  <div class="navbar">
    <span class="navlab">구역 이동</span>
    <div class="zones" id="zones"></div>
  </div>
  <div id="stage"></div>
  <footer>SECTOR 7 CONTAINMENT FACILITY — UNAUTHORIZED ENTRY LOGGED</footer>
</div>

<script>
/* ==================== 장면 ==================== */
var ART={};

ART.lobby=`<rect class="wall" x="0" y="0" width="600" height="252"/><rect class="wall2" x="0" y="0" width="600" height="46"/>
<rect class="floor" x="0" y="252" width="600" height="88"/><line class="ln" x1="0" y1="252" x2="600" y2="252"/>
<polygon class="amber" points="50,50 4,252 108,252" opacity=".07"/><rect class="metal" x="34" y="30" width="32" height="13" rx="2"/><circle class="amber" cx="50" cy="45" r="4.5"/>
<rect class="objd" x="186" y="62" width="128" height="80" rx="2"/><rect class="obj2" x="190" y="66" width="120" height="72"/>
<rect class="dark" x="222" y="74" width="56" height="56" opacity=".55"/>
<line class="lnf" x1="230" y1="86" x2="270" y2="86"/><line class="lnf" x1="230" y1="96" x2="266" y2="96"/><line class="lnf" x1="230" y1="106" x2="270" y2="106"/>
<circle class="amber" cx="250" cy="70" r="2.2" opacity=".8"/>

var LOCK_TOTAL=14;

var S={zone:"z1",open:null,seen:{},solved:{},revealed:{},notes:[],items:[],
  wrongs:0,hints:6,hintLv:{},start:Date.now(),done:false,seq:[],sw:{},trays:{},chains:{}};
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function br(t){return esc(t).replace(/\n/g,"<br>")}
function fmt(ms){var t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function tick(){if(!S.done)$("#clock").textContent=fmt(Date.now()-S.start)}
setInterval(tick,500);
function Z(id){for(var i=0;i<ZONES.length;i++)if(ZONES[i].id===id)return ZONES[i];return null}
function zoneByName(name){for(var i=0;i<ZONES.length;i++)if(ZONES[i].name===name)return ZONES[i];return null}
function curZ(){return Z(S.zone)}
function hasItem(n){return S.items.indexOf(n)>=0}
function lockDone(id){return !!S.solved[id]}
function addNote(zn,t){for(var i=0;i<S.notes.length;i++)if(S.notes[i].t===t)return;S.notes.push({z:zn,t:t})}
function nSolved(){var n=0;for(var k in S.solved)if(S.solved[k])n++;return n}
function allLocks(z){var a=[];for(var k in z.locks)a.push(k);return a}

function zoneOpen(z){
  if(z.opens)return true;
  if(!z.need)return true;
  if(z.need.lock)return lockDone(z.need.lock);
  if(z.need.item)return hasItem(z.need.item);
  return true;
}
function zoneClear(z){var a=allLocks(z);for(var i=0;i<a.length;i++)if(!lockDone(a[i]))return false;return a.length>0}
function zoneTodo(z){var a=allLocks(z),n=0;for(var i=0;i<a.length;i++)if(!lockDone(a[i]))n++;return n}

/* ==================== 렌더 ==================== */
function renderHud(){
  $("#wrongs").textContent=S.wrongs;
  $("#hintsLeft").textContent=S.hints;
  $("#lockCount").textContent=nSolved()+"/"+LOCK_TOTAL;
  $("#zones").innerHTML=ZONES.map(function(z){
    var op=zoneOpen(z),cl=zoneClear(z),cur=z.id===S.zone;
    var c="zn "+(op?"open":"shut")+(cur?" cur":"")+(cl&&!cur?" clear":"");
    var dot=(op&&!cl&&z.id!==S.zone)?'<span class="dot"></span>':"";
    return '<button class="'+c+'" data-z="'+z.id+'"'+(op?"":" disabled")+'><em>'+(op?z.num:"LOCK")+'</em><strong>'+z.name+dot+'</strong></button>';
  }).join("");
}

function hitRect(s,all){
  var MIN=76, cx=s.x+s.w/2, cy=s.y+s.h/2;
  var w=Math.max(s.w,MIN), h=Math.max(s.h,MIN), x, y, guard=0;
  function place(){ x=Math.max(0,Math.min(600-w,cx-w/2)); y=Math.max(0,Math.min(340-h,cy-h/2)) }
  function clash(){
    for(var i=0;i<all.length;i++){ var o=all[i];
      if(o.id===s.id) continue;
      if(x<o.x+o.w && x+w>o.x && y<o.y+o.h && y+h>o.y) return true }
    return false }
  place();
  while(clash() && (w>s.w||h>s.h) && guard++<40){
    w=Math.max(s.w,w-4); h=Math.max(s.h,h-4); place();
  }
  return {x:x,y:y,w:w,h:h};
}

function render(){
  if(S.done)return;
  var z=curZ();
  var spots=z.spots.filter(function(s){return !s.hidden||S.revealed[z.id+":"+s.id]});
  var found=spots.filter(function(s){return S.seen[z.id+":"+s.id]}).length;
  var todo=zoneTodo(z);

  var h='<div class="head"><div><div class="eyebrow">'+z.num+' 구역 · '+z.sys+' 계통</div><h1>'+z.name+'</h1></div>'
   + '<div class="progress">조사 <b>'+found+'</b>/'+spots.length+'<br>잠금 '+(todo?'<b>'+todo+'</b>개 남음':'<b>해제 완료</b>')+'</div></div>'
   + '<p class="flavor">'+br(z.flavor)+'</p>';

  var hots=spots.map(function(s){
    var seen=S.seen[z.id+":"+s.id];
    /* 아직 못 찾은 지점은 점도, 호버 반응도 없다.
       한 번 찾고 나면 그 지점만 영구히 드러난다. */
    var reveal = seen;
    var pc="pin"+(s.lock?(lockDone(s.lock)?" seen":" lock"):(seen?" seen":""));
    if(s.hidden&&!seen)pc="pin hid";
    var r=hitRect(s,spots);
    var dot = reveal ? '<circle class="'+pc+'" cx="'+s.px+'" cy="'+s.py+'" r="4.2"></circle>' : '';
    return '<g><rect class="hot'+(reveal?" known":"")+'" tabindex="0" role="button" aria-label="'+(seen?s.title:"미조사 지점")+'" data-spot="'+s.id+'" x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="2"></rect>'
     + dot + '</g>';
  }).join("");
  h+='<div class="sceneBox"><svg class="scene" viewBox="0 0 600 340" role="img" aria-label="'+z.name+'">'+z.art+'<g>'+hots+'</g></svg>'
   + '<div class="scanhint">표시가 없다. 방 안을 훑어 조사할 곳을 직접 찾아라</div></div>';

  /* 이미 찾아낸 곳만 모인다 — 새 지점은 그림에서 직접 찾아야 한다 */
  var known=spots.filter(function(s){return S.seen[z.id+":"+s.id]});
  h+='<div class="spotlist">'+(known.length
    ? '<span class="listlab">다시 보기</span>'+known.map(function(s){
        var done=s.lock&&lockDone(s.lock);
        var c=s.lock?(done?"done":"lock"):"seen";
        if(S.open===s.id) c+=" cur";
        return '<button class="'+c+'" data-spot="'+s.id+'"><span class="mk"></span>'+esc(s.title)+'</button>';
      }).join("")
    : '<span class="listlab dim">아직 조사한 곳이 없다. 그림을 훑어보라.</span>')+'</div>';

  h+=renderDetail();
  h+=renderTrays();
  $("#stage").innerHTML=h;
  renderHud();wire();decorate();
}

function renderDetail(){
  var z=curZ();
  if(!S.open)return '<div class="detail empty">조사할 지점을 고르세요. 한 방의 단서만으로는 열리지 않는 자물쇠가 있습니다.</div>';
  var sp=null;z.spots.forEach(function(s){if(s.id===S.open)sp=s});
  if(!sp)return '';

  var gate=sp.need;
  if(gate){
    var ok=gate.lock?lockDone(gate.lock):(gate.item?hasItem(gate.item):true);
    if(!ok) return '<div class="detail" id="detail"><div class="dtag">조사 중</div><div class="dtitle">'+sp.title+'</div>'
      + '<p class="dtext">'+br(sp.text)+'</p><div class="nothing">'+esc(sp.needMsg||"아직 손댈 수 없다.")+'</div></div>';
  }
  var body=sp.text, note=sp.note;
  if(sp.text2){
    var w = sp.when ? lockDone(sp.when.lock) : (sp.lock ? lockDone(sp.lock) : true);
    if(w) body=sp.text2;
  }

  var h='<div class="detail" id="detail"><div class="dtag">조사 중</div><div class="dtitle">'+sp.title+'</div>'
   + '<p class="dtext">'+br(body)+'</p>';
  if(sp.art)h+='<div class="dart">'+sp.art+'</div>';
  if(note)h+='<div class="noted"><b>수첩</b><span>'+esc(note)+'</span></div>';
  else if(!sp.lock)h+='<div class="nothing">기록할 만한 것은 없었다.</div>';
  if(sp.lock)h+=renderLock(sp.lock);
  h+='</div>';
  return h;
}

/* 자물쇠가 필요로 하는 단서 현황 — 내용은 절대 다시 보여주지 않는다.
   찾았는지 여부와 '어느 구역'인지만 알려준다. 실제 값을 조합하는 건
   수첩을 펼쳐 스스로 기억해내거나 다시 읽어야 하는 몫으로 남겨 둔다. */
function renderClues(L){
  if(!L.clues || !L.clues.length) return '';
  var have=[], miss=[];
  L.clues.forEach(function(c){
    var got = S.notes.some(function(n){return n.t===c.t});
    (got?have:miss).push(c);
  });
  var h='<div class="cluebox"><div class="cluehead">관련 단서 <b>'+have.length+'</b>/'+L.clues.length+' 확보</div><ul class="cluelist">';
  have.forEach(function(c){ h+='<li class="got"><em>확보</em>'+esc(c.z)+'</li>'; });
  miss.forEach(function(c){
    var zn=zoneByName(c.z), reachable = !zn || zoneOpen(zn);
    if(reachable) h+='<li class="todo"><em>미확보</em>'+esc(c.z)+'</li>';
    else h+='<li class="blocked"><em>봉쇄</em>'+esc(c.z)+' — 아직 못 들어간다</li>';
  });
  h+='</ul></div>';
  return h;
}

function renderLock(id){
  var z=curZ(),L=z.locks[id];
  if(!L)return '';
  if(lockDone(id)){
    return '<div class="unlock"><div class="eyebrow">해제됨</div><p>'+br(L.solved||"")+'</p>'
     + ((L.items&&L.items.length)||L.opens ? '<div class="gotrow">'
        + (L.items||[]).map(function(i){return '<div class="gotitem"><em>획득</em>'+i+'</div>'}).join("")
        + (L.opens||[]).map(function(o){return '<div class="gotitem open"><em>개방</em>'+Z(o).name+'</div>'}).join("")
        + '</div>' : '') + '</div>';
  }
  if(L.need && !lockDone(L.need.lock))
    return '<div class="lockbox"><div class="lockhead"><h3>'+L.name+'</h3><span>비활성</span></div>'
     + '<div class="nothing" style="margin-top:9px">선행 장치가 아직 해제되지 않았다.</div></div>';

  var h='<div class="lockbox"><div class="lockhead"><h3>'+L.name+'</h3><span>'+(L.sub||"")+'</span></div>';
  h+=renderClues(L);
  if(L.type==="keypad"){
    h+='<div class="answer"><input type="text" id="ans" inputmode="numeric" maxlength="'+(L.max||4)+'" placeholder="'+(L.ph||"입력")+'" autocomplete="off">'
     +'<button class="btn" id="submit">입력</button></div>';
  }else if(L.type==="sequence"){
    h+='<div class="seq">'+L.colors.map(function(c){
      var face = c.text
        ? '<span class="ctext">'+c.text+'</span>'
        : '<span style="background:'+c.hex+'"></span>';
      return '<button class="cbtn" data-c="'+c.k+'" title="'+c.label+'">'+face+'</button>'}).join("")+'</div>'
     +'<div class="seqview">입력: '+(S.seq.length?S.seq.map(function(k){var f="";L.colors.forEach(function(c){if(c.k===k)f=c.label});return f}).join(" › "):"—")+'</div>'
     +'<div class="answer" style="margin-top:4px"><button class="btn ghost" id="seqclear">처음부터</button></div>';
  }else if(L.type==="switches"){
    var lab=["A1","A2","A3","A4","B1","B2","B3","B4"];
    h+='<div class="switchgrid">'+lab.map(function(l){
      return '<div class="sw'+(S.sw[l]?" on":"")+'" data-sw="'+l+'" role="button" tabindex="0"><em>'+l+'</em><div class="track"><div class="knob"></div></div></div>'}).join("")+'</div>'
     +'<div class="answer" style="margin-top:12px"><button class="btn" id="submit">차단기 투입</button></div>';
  }else if(L.type==="auto"){
    h+='<div class="answer"><button class="btn" id="submit">램프 모듈 끼우기</button></div>';
  }

  var lv=S.hintLv[id]||0;
  h+='<div class="meta"><button class="hintbtn" id="hintBtn"'+((S.hints<=0||lv>=3)?" disabled":"")+'>'
   +(lv>=3?"힌트 모두 사용":(S.hints<=0?"힌트 소진":"힌트 "+(lv+1)+"단계 보기 (남은 "+S.hints+"회)"))+'</button><span class="msg" id="msg"></span></div>';
  if(lv>0){
    h+='<div class="hints">';
    for(var i=0;i<lv;i++) h+='<div class="hintrow"><b>'+(i+1)+'단계 · '+["방향","연결","풀이"][i]+'</b>'+esc(L.hints[i])+'</div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function renderTrays(){
  /* 수첩은 오직 '지금 서 있는 방'의 단서만 보여준다. 다른 방 목록 자체가
     없다 — 다른 방의 단서를 다시 보려면 실제로 그 구역으로 이동해야
     한다. 그래야 여러 방의 값을 한자리에서 펼쳐놓고 대조하는 게
     원천적으로 불가능해지고, 조합은 직접 기억하거나 적어야 가능하다. */
  var z=curZ();
  var here=S.notes.filter(function(n){return n.z===z.name}).map(function(n){return n.t});
  var nb = here.length
    ? '<div class="nzhead cur"><span class="k">'+z.num+'</span><span>'+z.name+'</span><span class="nzn">'+here.length+'</span></div>'
      + '<ul class="notes">'+here.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>'
    : '<p class="notes none">이 방에서는 아직 기록한 단서가 없다.</p>';

  return '<div class="trays">'
   + tray("notes","단서 수첩","NOTEBOOK",here.length,nb)
   + tray("items","소지품","INVENTORY",S.items.length,
      S.items.length?'<div class="items">'+S.items.map(function(i){return '<div class="item">'+i+'</div>'}).join("")+'</div>'
       :'<p class="notes none">가진 것이 없다.</p>')
   + '<div class="tray"><button id="resetBtn"><span class="k">처음부터 다시</span><span class="caret">↺</span></button></div></div>';
}
function tray(id,label,tag,n,body){
  return '<div class="tray'+(S.trays[id]?" open":"")+'" data-tray="'+id+'">'
   +'<button><span class="k">'+tag+'</span><span>'+label+'</span><span class="n">'+n+'</span><span class="caret">'+(S.trays[id]?"▲":"▼")+'</span></button>'
   +'<div class="traybody">'+body+'</div></div>';
}

/* ==================== 동작 ==================== */
function wire(){
  var z=curZ();
  Array.prototype.forEach.call(document.querySelectorAll("[data-z]"),function(b){
    if(b.disabled)return;
    b.onclick=function(){ if(b.dataset.z===S.zone)return; S.zone=b.dataset.z;S.open=null;S.seq=[];render();window.scrollTo({top:0,behavior:"smooth"}) };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-spot]"),function(el){
    el.onclick=function(){openSpot(el.dataset.spot)};
    el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openSpot(el.dataset.spot)}};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-tray] > button"),function(b){
    var id=b.parentNode.dataset.tray; if(id) b.onclick=function(){S.trays[id]=!S.trays[id];render()};
  });
  var rb=$("#resetBtn"); if(rb)rb.onclick=function(){if(window.confirm("진행 상황을 지우고 처음부터 시작할까요?"))reset()};

  var sp=null; z.spots.forEach(function(s){if(s.id===S.open)sp=s});
  if(!sp||!sp.lock||lockDone(sp.lock))return;
  var id=sp.lock, L=z.locks[id];
  if(L.need&&!lockDone(L.need.lock))return;

  var hb=$("#hintBtn");
  if(hb)hb.onclick=function(){
    var lv=S.hintLv[id]||0; if(lv>=3||S.hints<=0)return;
    S.hintLv[id]=lv+1; S.hints--; render(); keepOpen();
  };
  var sb=$("#submit");
  if(L.type==="keypad"){
    var inp=$("#ans");
    var go=function(){ tryLock(id, inp.value.trim()===L.answer) };
    if(sb)sb.onclick=go;
    if(inp)inp.onkeydown=function(e){if(e.key==="Enter")go()};
  }else if(L.type==="sequence"){
    Array.prototype.forEach.call(document.querySelectorAll("[data-c]"),function(b){
      b.onclick=function(){
        S.seq.push(b.dataset.c);
        if(S.seq.length>=L.answer.length){
          var ok=S.seq.join("")===L.answer.join(""); if(!ok)S.seq=[];
          tryLock(id,ok);
        } else { render(); keepOpen() }
      };
    });
    var sc=$("#seqclear"); if(sc)sc.onclick=function(){S.seq=[];render();keepOpen()};
  }else if(L.type==="switches"){
    Array.prototype.forEach.call(document.querySelectorAll("[data-sw]"),function(el){
      var t=function(){S.sw[el.dataset.sw]=!S.sw[el.dataset.sw];render();keepOpen()};
      el.onclick=t; el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}};
    });
    if(sb)sb.onclick=function(){
      var all=["A1","A2","A3","A4","B1","B2","B3","B4"];
      var want=L.answerOn||["B1","B2","B3","B4"];
      var aOn=["A1","A2","A3","A4"].some(function(k){return S.sw[k]});
      if(aOn){tryLock(id,false,"A 라인이 올라갔다. 어딘가에서 경보가 짧게 울린다.");return}
      var exact=all.every(function(k){return !!S.sw[k]===(want.indexOf(k)>=0)});
      var onCount=all.filter(function(k){return S.sw[k]}).length;
      var msg = onCount===0 ? "아무것도 올리지 않았다."
        : (onCount>want.length ? "과부하다. 소손된 계통까지 올렸다 — 두꺼비집이 도로 떨어진다."
                               : "전원이 부족하다. 살아 있는 계통이 다 올라가지 않았다.");
      tryLock(id,exact,exact?"":msg);
    };
  }else if(L.type==="auto"){
    if(sb)sb.onclick=function(){ tryLock(id,true) };
  }
}

function keepOpen(){var d=$("#detail");if(d)d.scrollIntoView({block:"nearest"});var i=$("#ans");if(i)i.focus({preventScroll:true})}

function openSpot(id){
  var z=curZ(),sp=null; z.spots.forEach(function(s){if(s.id===id)sp=s});
  if(!sp)return;
  var gate=sp.need;
  if(gate){ var ok=gate.lock?lockDone(gate.lock):(gate.item?hasItem(gate.item):true);
    if(!ok){ S.open=id; render(); return } }
  S.open=id; S.seen[z.id+":"+id]=true;
  if(sp.note)addNote(z.name,sp.note);
  render();
  var d=$("#detail"); if(d)d.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function tryLock(id,ok,failMsg){
  var z=curZ(),L=z.locks[id];
  if(ok){
    S.solved[id]=true; S.seq=[];
    (L.items||[]).forEach(function(i){if(!hasItem(i))S.items.push(i)});
    if(L.note)addNote(z.name,L.note);
    if(L.chain)S.chains[L.chain]=true;
    if(L.reveal){ S.revealed[L.reveal.zone+":"+L.reveal.spot]=true }
    if(L.reexamine)S.open=L.reexamine;
    if(id==="L14"){finish();return}
    render();
    var u=document.querySelector(".unlock"); if(u)u.scrollIntoView({behavior:"smooth",block:"center"});
    if(L.revealMsg){ var d=$("#detail"); if(d){ var n=document.createElement("div"); n.className="reveal"; n.textContent="▸ "+L.revealMsg; d.appendChild(n) } }
  }else{
    S.wrongs++; render(); keepOpen();
    var m=$("#msg");
    if(m){m.className="msg bad";
      m.textContent=failMsg||["잠금이 반응하지 않는다.","틀렸다. 수첩을 다시 보라.","기계음만 짧게 울린다.","다른 방에 아직 못 본 것이 있다."][S.wrongs%4]}
    var dd=$("#detail"); if(dd){dd.classList.remove("shake");void dd.offsetWidth;dd.classList.add("shake")}
  }
}

function finish(){
  S.done=true;
  var ms=Date.now()-S.start,t=fmt(ms),used=6-S.hints;
  var sc=0,tot=0;
  ZONES.forEach(function(z){ z.spots.forEach(function(s){ tot++; if(S.seen[z.id+":"+s.id])sc++ }) });
  var rank="A · 침착한 탈출자",note="필요한 것만 보고 나왔다.";
  if(S.wrongs===0&&used===0){rank="S · 무결점 탈출";note="오조작도 힌트도 없다. 이 건물이 남긴 기록을 설계된 그대로 읽어냈다."}
  else if(S.wrongs+used*2>=16){rank="C · 가까스로 탈출";note="문은 열렸다. 지금은 그게 전부다."}
  else if(S.wrongs+used*2>=8){rank="B · 끈질긴 탈출자";note="막힐 때마다 결국 다른 방으로 돌아가 다시 뒤졌다."}
  var best="";
  try{var p=localStorage.getItem("lab7-best2");
    if(!p||ms<Number(p)){localStorage.setItem("lab7-best2",String(ms));best="개인 최고 기록 경신"}
    else best="개인 최고 기록 "+fmt(Number(p))}catch(e){}

  $("#stage").innerHTML=
   '<div class="ending"><div class="eyebrow" style="color:var(--cyan)">BLAST GATE 07 — UNSEALED</div>'
   +'<h2>게이트가 올라간다.</h2>'
   +'<p class="flavor" style="border-color:var(--cyan);color:#b8cfc9">강철이 레일을 따라 밀려 올라가고, 6년 만의 바깥 공기가 통로로 밀려든다. 뒤에서 여덟 구역의 비상등이 번호 순서대로 하나씩 꺼진다. 3호 냉동고의 팬 소리가 마지막으로 멈춘다.<br><br>제7연구소는 다시 어둠으로 돌아간다. 이번에는 안에 아무도 없다.</p>'
   +'<div class="scores"><div><b>'+t+'</b><i>탈출 시간</i></div>'
   +'<div><b>'+sc+'/'+tot+'</b><i>조사 지점</i></div>'
   +'<div><b>'+S.wrongs+'</b><i>오조작</i></div>'
   +'<div><b>'+used+'</b><i>사용 힌트</i></div></div>'
   +'<p class="rank"><b>'+rank+'</b><br>'+note+(best?' · '+best:'')+'</p>'
   +'<div style="margin-top:20px"><button class="btn big" id="again">다시 도전</button></div></div>';
  $("#again").onclick=reset; renderHud();
}

function reset(){
  S={zone:"z1",open:null,seen:{},solved:{},revealed:{},notes:[],items:[],
    wrongs:0,hints:6,hintLv:{},start:Date.now(),done:false,seq:[],sw:{},trays:{},chains:{}};
  render();tick();window.scrollTo({top:0,behavior:"smooth"});
}

/* ==================== 장식 ==================== */
function decorate(){
  var z=curZ();
  if(z.id==="z4"){
    var on=lockDone("L5"),la=document.getElementById("ledsA"),lb=document.getElementById("ledsB"),po=document.getElementById("ports");
    if(la&&lb){var g="",g2="";
      for(var r=0;r<11;r++)for(var c=0;c<5;c++){
        var l1=on&&((r*5+c)%3!==0),l2=on&&((r*3+c)%4!==0);
        g+='<circle cx="'+(58+c*16)+'" cy="'+(90+r*14)+'" r="2.1" fill="'+(l1?"#5ad0c0":"#22303a")+'"/>';
        g2+='<circle cx="'+(164+c*16)+'" cy="'+(90+r*14)+'" r="2.1" fill="'+(l2?"#5ad0c0":"#22303a")+'"/>';}

function start(saved){
  if(saved&&saved.S){Object.assign(S,saved.S);S.start=Date.now()-(saved.elapsed||0)}
  if(S.done)finish();else render();
  tick();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)
  window.claude.hot.snapshot(function(){return {S:S,elapsed:Date.now()-S.start}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
